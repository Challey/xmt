<VirtualHost *:88>
ServerAdmin admin@xmt.pub
php_admin_value open_basedir "/home/wwwroot/xmt/web:/home/wwwroot/xmt:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/xmt/web"
ServerName airobotor.com
ServerAlias airobotor.com www.airobotor.com airobotor.wsl
ErrorLog "/home/wwwlogs/airobotor.com-error_log"
CustomLog "/home/wwwlogs/airobotor.com-access_log" combined
<Directory "/home/wwwroot/xmt/web">
    SetOutputFilter DEFLATE
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>
</VirtualHost>
