<VirtualHost *:88>
ServerAdmin admin@xmt.pub
php_admin_value open_basedir "/home/wwwroot/xmt/web:/home/wwwroot/xmt:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/xmt/web"
ServerName hm-os.com
ServerAlias hm-os.com www.hm-os.com hm-os.cn www.hm-os.cn hmos.wsl
ErrorLog "/home/wwwlogs/hm-os.com-error_log"
CustomLog "/home/wwwlogs/hm-os.com-access_log" combined
<Directory "/home/wwwroot/xmt/web">
    SetOutputFilter DEFLATE
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>
</VirtualHost>
