<VirtualHost *:88>
ServerAdmin admin@xmt.pub
php_admin_value open_basedir "/home/wwwroot/xmt/web:/home/wwwroot/xmt:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/xmt/web"
ServerName drupal.org.cn
ServerAlias drupal.org.cn www.drupal.org.cn drupalcn.wsl
ErrorLog "/home/wwwlogs/drupal.org.cn-error_log"
CustomLog "/home/wwwlogs/drupal.org.cn-access_log" combined
<Directory "/home/wwwroot/xmt/web">
    SetOutputFilter DEFLATE
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>
</VirtualHost>
