<VirtualHost *:88>
ServerAdmin admin@xmt.pub
php_admin_value open_basedir "/home/wwwroot/xmt/web:/home/wwwroot/xmt:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/xmt/web"
ServerName xmt.pub
ServerAlias xmt.pub www.xmt.pub xmt.wsl
ErrorLog "/home/wwwlogs/xmt.pub-error_log"
CustomLog "/home/wwwlogs/xmt.pub-access_log" combined
<Directory "/home/wwwroot/xmt/web">
    SetOutputFilter DEFLATE
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>
</VirtualHost>
