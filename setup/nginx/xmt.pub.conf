# Reference vhost for Server B (copy to /usr/local/nginx/conf/vhost/www.xmt.pub.conf).
# Requires: /usr/local/nginx/conf/ssl/www.xmt.pub/fullchain.cer + www.xmt.pub.key

server
    {
        listen 80;
        server_name xmt.pub www.xmt.pub xmt.wsl;
        index index.php index.html index.htm;
        root /home/wwwroot/xmt/web;

        location ~ /.well-known {
            allow all;
        }

        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
        {
            expires 30d;
        }

        location ~ .*\.(js|css)?$
        {
            expires 12h;
        }

        location ~ /\.
        {
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }

        access_log /home/wwwlogs/xmt.pub.log;
    }

server
    {
        listen 443 ssl;
        http2 on;
        server_name xmt.pub www.xmt.pub xmt.wsl;
        index index.php index.html index.htm;
        root /home/wwwroot/xmt/web;

        ssl_certificate /usr/local/nginx/conf/ssl/www.xmt.pub/fullchain.cer;
        ssl_certificate_key /usr/local/nginx/conf/ssl/www.xmt.pub/www.xmt.pub.key;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "TLS13-AES-256-GCM-SHA384:TLS13-CHACHA20-POLY1305-SHA256:TLS13-AES-128-GCM-SHA256:TLS13-AES-128-CCM-8-SHA256:TLS13-AES-128-CCM-SHA256:EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5";
        ssl_session_cache builtin:1000 shared:SSL:10m;
        ssl_dhparam /usr/local/nginx/conf/ssl/dhparam.pem;

        include proxy-pass-php.conf;

        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
        {
            expires 30d;
        }

        location ~ .*\.(js|css)?$
        {
            expires 12h;
        }

        location ~ /.well-known {
            allow all;
        }

        location ~ /\.
        {
            deny all;
        }

        access_log /home/wwwlogs/xmt.pub.log;
    }
