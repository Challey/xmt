xmt_trust_ui.feed:
  path: '/trusted'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustFeedController::feed'
    _title: '可信内容'
    filter: 'all'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_official:
  path: '/trusted/official'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustFeedController::feed'
    _title: '官方可信'
    filter: 'l1_official'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_enterprise:
  path: '/trusted/enterprise'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustFeedController::feed'
    _title: '企业可信'
    filter: 'l2_enterprise'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_aggregate:
  path: '/trusted/aggregate'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustFeedController::feed'
    _title: '领域汇聚'
    filter: 'l0_aggregate'
  requirements:
    _permission: 'access content'

xmt_trust_ui.provenance_audit:
  path: '/admin/xmt/provenance'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\ProvenanceAuditController::list'
    _title: 'Provenance audit'
  requirements:
    _permission: 'administer xmt trust'

xmt_trust_ui.provenance_audit_export_csv:
  path: '/admin/xmt/provenance/export.csv'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\ProvenanceAuditController::exportCsv'
  requirements:
    _permission: 'administer xmt trust'

xmt_trust_ui.provenance_audit_export_json:
  path: '/admin/xmt/provenance/export.json'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\ProvenanceAuditController::exportJson'
  requirements:
    _permission: 'administer xmt trust'
