xmt_trust_ui.feed:
  path: '/trusted'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustFeedController::feed'
    _title: '可信内容'
    filter: 'all'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_official:
  path: '/trusted/official'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustFeedController::feed'
    _title: '官方可信'
    filter: 'l1_official'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_enterprise:
  path: '/trusted/enterprise'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustFeedController::feed'
    _title: '企业可信'
    filter: 'l2_enterprise'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_aggregate:
  path: '/trusted/aggregate'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustFeedController::feed'
    _title: '领域汇聚'
    filter: 'l0_aggregate'
  requirements:
    _permission: 'access content'

xmt_trust_ui.feed_rss:
  path: '/trusted/feed.rss'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustedFeedFormatController::rss'
    filter: 'all'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_json:
  path: '/trusted/feed.json'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustedFeedFormatController::json'
    filter: 'all'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_official_rss:
  path: '/trusted/official/feed.rss'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustedFeedFormatController::rss'
    filter: 'l1_official'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_official_json:
  path: '/trusted/official/feed.json'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustedFeedFormatController::json'
    filter: 'l1_official'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_enterprise_rss:
  path: '/trusted/enterprise/feed.rss'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustedFeedFormatController::rss'
    filter: 'l2_enterprise'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_enterprise_json:
  path: '/trusted/enterprise/feed.json'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustedFeedFormatController::json'
    filter: 'l2_enterprise'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_aggregate_rss:
  path: '/trusted/aggregate/feed.rss'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustedFeedFormatController::rss'
    filter: 'l0_aggregate'
  requirements:
    _permission: 'access content'
xmt_trust_ui.feed_aggregate_json:
  path: '/trusted/aggregate/feed.json'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustedFeedFormatController::json'
    filter: 'l0_aggregate'
  requirements:
    _permission: 'access content'

xmt_trust_ui.publishers_directory:
  path: '/publishers'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\PublisherDirectoryController::list'
    _title: '认证发布主体'
  requirements:
    _permission: 'access content'

xmt_trust_ui.trust_sitemap:
  path: '/trusted/sitemap.xml'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\TrustSitemapController::sitemap'
    _title: 'Trust sitemap'
  requirements:
    _permission: 'access content'

xmt_trust_ui.verify:
  path: '/trusted/verify'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\ProvenanceHashLookupController::page'
    _title: '溯源核验'
  requirements:
    _permission: 'access content'

xmt_trust_ui.publisher_feed_rss:
  path: '/publisher/{xmt_publisher}/feed.rss'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\PublisherFeedFormatController::rss'
    _title: 'Publisher feed'
  requirements:
    _entity_access: 'xmt_publisher.view'
    xmt_publisher: \d+
  options:
    parameters:
      xmt_publisher:
        type: entity:xmt_publisher

xmt_trust_ui.publisher_feed_json:
  path: '/publisher/{xmt_publisher}/feed.json'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\PublisherFeedFormatController::json'
    _title: 'Publisher feed'
  requirements:
    _entity_access: 'xmt_publisher.view'
    xmt_publisher: \d+
  options:
    parameters:
      xmt_publisher:
        type: entity:xmt_publisher

xmt_trust_ui.provenance_verify:
  path: '/trusted/verify/{node}'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\ProvenanceVerifyController::page'
    _title_callback: '\Drupal\xmt_trust_ui\Controller\ProvenanceVerifyController::title'
  requirements:
    _entity_access: 'node.view'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
xmt_trust_ui.provenance_verify_json:
  path: '/trusted/verify/{node}/json'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\ProvenanceVerifyController::json'
  requirements:
    _entity_access: 'node.view'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node


xmt_trust_ui.provenance_audit:
  path: '/admin/xmt/provenance'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\ProvenanceAuditController::list'
    _title: 'Provenance audit'
  requirements:
    _permission: 'administer xmt trust'

xmt_trust_ui.provenance_audit_export:
  path: '/admin/xmt/provenance/export'
  defaults:
    _controller: '\Drupal\xmt_trust_ui\Controller\ProvenanceAuditController::exportCsv'
    _title: 'Export provenance audit'
  requirements:
    _permission: 'administer xmt trust'
