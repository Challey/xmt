xmt_dx_bridge.claim:
  path: '/api/xmt/v1/dx-claim'
  defaults:
    _controller: '\Drupal\xmt_dx_bridge\Controller\DxClaimController::claim'
  requirements:
    _access: 'TRUE'
  methods: [POST]

xmt_dx_bridge.content:
  path: '/api/xmt/v1/trusted-content'
  defaults:
    _controller: '\Drupal\xmt_dx_bridge\Controller\DxClaimController::content'
  requirements:
    _access: 'TRUE'
  methods: [POST]
