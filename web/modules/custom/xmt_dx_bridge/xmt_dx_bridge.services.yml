services:
  xmt_dx_bridge.nonce_guard:
    class: Drupal\xmt_dx_bridge\Service\DxNonceGuard
    arguments:
      - '@keyvalue.expirable'
  xmt_dx_bridge.claim_handler:
    class: Drupal\xmt_dx_bridge\Service\DxClaimHandler
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@xmt_dx_bridge.nonce_guard'
  xmt_dx_bridge.content_handler:
    class: Drupal\xmt_dx_bridge\Service\DxContentHandler
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@xmt_dx_bridge.claim_handler'
      - '@xmt_dx_bridge.nonce_guard'
